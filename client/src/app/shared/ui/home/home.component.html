<div
  class="bg-gradient-to-br from-blue-400 to-purple-500 min-h-screen flex items-center justify-center p-4"
>
  <div
    class="bg-white bg-opacity-90 rounded-2xl p-8 md:p-12 shadow-xl max-w-md w-full transform transition duration-500 hover:shadow-2xl"
  >
    <div class="text-center">
      <h1 class="text-3xl md:text-4xl font-bold text-gray-800 mb-4">
        Bienvenue
      </h1>
      <p class="text-gray-600 mb-8">
        Découvrez notre plateforme et rejoignez notre communauté dès
        aujourd'hui.
      </p>

      <div class="space-y-4">
        <button
          (click)="singup()"
          class="w-full py-4 bg-blue-500 hover:bg-blue-600 text-white font-semibold rounded-lg shadow-md hover:shadow-lg transform transition duration-300 hover:-translate-y-1 uppercase tracking-wide"
        >
          Créer un compte
        </button>

        <button
          (click)="login()"
          class="w-full py-4 bg-white hover:bg-gray-50 text-blue-500 font-semibold rounded-lg shadow-sm border-2 border-blue-500 hover:shadow-md transform transition duration-300 hover:-translate-y-1 uppercase tracking-wide"
        >
          Se connecter
        </button>
      </div>
    </div>
  </div>
</div>
